# AWS Amplify Hosting — build spec pro app Next.js (RFC 6.2/8: "AWS Amplify Hosting,
# deploy contínuo do Next.js integrado ao GitHub"). Amplify detecta esse arquivo
# automaticamente ao conectar o repositório.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci
    build:
      commands:
        # O Amplify só expõe as env vars do console durante o build. O SSR roda
        # depois, em outro ambiente, e não as enxerga — por isso as que o
        # servidor usa são gravadas no .env.production, que o Next carrega em
        # runtime. Não entram AWS_*: o Amplify reserva esse prefixo, e o S3 usa
        # a IAM compute role do app (sem chave de acesso).
        # O sed escapa os "$" (o hash bcrypt tem vários): o Next expande $VAR
        # dentro do .env e corromperia o valor.
        - env | grep -E '^(DATABASE_URL|NEXTAUTH_SECRET|NEXTAUTH_URL|OWNER_EMAIL|OWNER_PASSWORD_HASH|COGNITO_CLIENT_ID|COGNITO_CLIENT_SECRET|COGNITO_ISSUER|S3_BUCKET_NAME|WHATSAPP_NUMBER)=' | sed 's/\$/\\$/g' >> .env.production || true
        # `npm run build` = prisma generate + prisma migrate deploy + next build.
        # O migrate deploy aplica no RDS só as migrações que faltam.
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
